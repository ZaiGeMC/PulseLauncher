<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseLauncher</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    body {
      background: url("back.png") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== 顶部导航栏 ===== */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .topbar-logo {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.3px;
    }
    .topbar-logo span { color: #4a90d9; }

    /* ===== 窗口框架 ===== */
    .app-frame {
      margin-top: 48px;
      width: 960px;
      height: 600px;
      background: #f0f2f5;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== 标题栏 ===== */
    .titlebar {
      height: 38px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      user-select: none;
      border-bottom: 1px solid #e0e0e0;
    }
    .titlebar-logo {
      color: #333;
      font-size: 13px;
      font-weight: 600;
    }

    /* ===== 主体 ===== */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 64px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 6px;
      flex-shrink: 0;
      border-right: 1px solid #e0e0e0;
    }
    .nav-btn {
      width: 46px;
      height: 46px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, color 0.18s;
    }
    .nav-btn:hover { background: #f0f2f5; color: #555; }
    .nav-btn.active {
      color: #4a90d9;
      background: rgba(74,144,217,0.08);
      box-shadow: inset 3px 0 0 #4a90d9;
    }
    .nav-spacer { flex: 1; }

    /* ===== 内容区 ===== */
    .content { flex: 1; overflow: hidden; position: relative; background: #f0f2f5; }
    .page { display: none; width: 100%; height: 100%; overflow-y: auto; }
    .page.active { display: block; }

    /* ===== 首页 ===== */
    .home-layout {
      padding: 32px 36px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .home-hero {
      text-align: center;
      animation: fadeDown 0.6s ease both;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .home-hero h1 { font-size: 32px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .home-hero p  { font-size: 14px; color: #666; line-height: 1.6; max-width: 460px; }

    .launch-btn {
      padding: 11px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #4a90d9;
      color: #fff;
      box-shadow: 0 3px 10px rgba(74,144,217,0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      animation: fadeIn 0.7s 0.2s ease both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .launch-version {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 400;
    }
    .launch-btn:hover {
      background: #3a7bc8;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(74,144,217,0.4);
    }
    .launch-btn:active { transform: translateY(0); }

    /* ===== 下载页 ===== */
    .download-layout { display: flex; height: 100%; }
    .download-tabs {
      width: 180px;
      background: #ffffff;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .dt-tab {
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      border-radius: 8px;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .dt-tab:hover { background: #f0f2f5; color: #444; }
    .dt-tab.active { background: rgba(74,144,217,0.08); color: #4a90d9; }
    .dt-tab-title { display: block; font-size: 13px; font-weight: 600; color: inherit; }
    .dt-tab-sub { display: block; font-size: 11px; opacity: 0.6; margin-top: 2px; }
    .download-content { flex: 1; overflow-y: auto; padding: 24px; }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .feature-card {
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.22s, box-shadow 0.22s;
      animation: fadeUp 0.5s ease both;
    }
    .feature-card:nth-child(1) { animation-delay: 0s; }
    .feature-card:nth-child(2) { animation-delay: 0.08s; }
    .feature-card:nth-child(3) { animation-delay: 0.16s; }
    .feature-card:nth-child(4) { animation-delay: 0.24s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    .feature-img {
      width: 100%;
      height: 130px;
      background: #dde3ea;
      overflow: hidden;
    }
    .feature-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .feature-img .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #99a;
      font-size: 12px;
    }
    .feature-desc {
      padding: 14px 16px 16px;
      font-size: 13px;
      color: #444;
      line-height: 1.6;
    }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="topbar">
    <div class="topbar-logo">Pulse<span>Launcher</span></div>
  </div>

  <!-- 自定义应用边框 -->
  <div class="app-frame">
    <!-- 标题栏 -->
    <header class="titlebar">
      <div class="titlebar-logo">Pulse Launcher</div>
    </header>

    <!-- 主体内容 -->
    <main class="main">
      <!-- 左侧导航 -->
      <nav class="sidebar" id="sidebar">
        <button class="nav-btn nav-btn-play active" data-page="home" title="主页">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
        <button class="nav-btn nav-btn-download" data-page="download" title="下载">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <circle cx="17" cy="9" r="2" />
            <path d="M2 16l5-5 4 4 3-3 8 8" />
          </svg>
        </button>
        <div class="nav-spacer"></div>
      </nav>

      <!-- 右侧内容 -->
      <section class="content" id="content">
        <!-- 启动游戏界面（主页） -->
        <div class="page page-home active" data-page="home">
          <div class="home-layout">
            <div class="home-hero">
              <h1>PulseLauncher</h1>
              <p>新一代 Minecraft Java 版启动器 — 极速启动，轻量纯粹，为你带来流畅的游戏体验。</p>
            </div>
            <button class="launch-btn" id="launchBtn">
              下载最新版
              <span class="launch-version" id="launchVersion">加载中...</span>
            </button>
            <div id="updateNotice" style="margin-top:12px;font-size:12px;color:#666;text-align:center;display:none;"></div>
          </div>
        </div>

        <!-- 下载界面（展示4张特色卡片） -->
        <div class="page page-download" data-page="download">
          <div class="download-layout">
            <div class="download-tabs">
              <button class="dt-tab active" data-cat="features">
                <span class="dt-tab-title">特色功能</span>
                <span class="dt-tab-sub">软件亮点介绍</span>
              </button>
            </div>
            <div class="download-content">
              <div class="feature-grid">
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="1.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 1.png</div>
                  </div>
                  <div class="feature-desc">海量免费的资源，一键下载</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="2.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 2.png</div>
                  </div>
                  <div class="feature-desc">启动快速，秒开游戏</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="3.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 3.png</div>
                  </div>
                  <div class="feature-desc">占用小，性能高效</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="4.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 4.png</div>
                  </div>
                  <div class="feature-desc">UI 简洁美观</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const navBtns = document.querySelectorAll('.nav-btn');
    const pages = document.querySelectorAll('.page');

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        navBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        pages.forEach(p => p.classList.remove('active'));
        document.querySelector(`.page[data-page="${page}"]`).classList.add('active');
      });
    });

    document.getElementById('launchBtn').addEventListener('click', () => {
      window.location.href = 'https://www.baidu.com';
    });

    // 检查更新
    async function checkUpdate() {
      try {
        const res = await fetch('update.json?t=' + Date.now());
        const data = await res.json();
        const versionEl = document.getElementById('launchVersion');
        const noticeEl = document.getElementById('updateNotice');
        versionEl.textContent = 'V' + data.version;
        document.getElementById('launchBtn').onclick = () => {
          window.location.href = data.downloadUrl;
        };
        noticeEl.style.display = 'block';
        noticeEl.textContent = '最新版本 V' + data.version + ' — ' + (data.releaseNotes || '');
      } catch (e) {
        document.getElementById('launchVersion').textContent = 'V1.0.1';
      }
    }
    checkUpdate();
  </script>
</body>
</html>
