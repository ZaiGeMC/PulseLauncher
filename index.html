<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseLauncher</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" />
  <style>
    :root {
      /* 薰衣草紫主题（与应用一致） */
      --color-accent: #a855f7;
      --color-accent-hover: #9333ea;
      --color-accent-soft: rgba(168, 85, 247, 0.16);
      --color-accent-grad: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      --color-accent-glow: rgba(168, 85, 247, 0.38);
      --color-surface: rgba(255, 255, 255, 0.62);
      --color-surface-strong: rgba(255, 255, 255, 0.82);
      --color-border: rgba(216, 180, 254, 0.55);
      --color-border-strong: #d8b4fe;
      --color-text: #3b2a4a;
      --color-text-sub: #6b5b80;
      --color-text-dim: #9b8bb0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 14px 36px rgba(124, 58, 180, 0.22);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px; line-height: 1.5; color: var(--color-text);
    }
    body {
      background: url("back.png") no-repeat center center fixed;
      background-size: cover;
      display: flex; align-items: center; justify-content: center;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.4); }

    /* ===== 顶部导航栏（亚克力） ===== */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0; height: 48px;
      background: rgba(240, 224, 255, 0.55);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      border-bottom: 1px solid var(--color-border);
      box-shadow: 0 1px 6px rgba(124, 58, 180, 0.08);
    }
    .topbar-logo { font-size: 16px; font-weight: 700; color: var(--color-text); letter-spacing: 0.3px; }
    .topbar-logo span { color: var(--color-accent); }

    /* ===== 窗口框架（亚克力面板） ===== */
    .app-frame {
      margin-top: 48px;
      width: 960px; height: 620px;
      background: rgba(240, 224, 255, 0.42);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      backdrop-filter: blur(26px) saturate(150%);
      border-radius: 16px;
      border: 1px solid var(--color-border-strong);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ===== 标题栏 ===== */
    .titlebar {
      height: 40px;
      background: rgba(255, 255, 255, 0.5);
      display: flex; align-items: center;
      padding: 0 16px; flex-shrink: 0;
      user-select: none;
      border-bottom: 1px solid var(--color-border);
    }
    .titlebar-logo { color: var(--color-text); font-size: 13px; font-weight: 600; }

    /* ===== 主体 ===== */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 64px;
      background: rgba(255, 255, 255, 0.5);
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 0; gap: 6px; flex-shrink: 0;
      border-right: 1px solid var(--color-border);
    }
    .nav-btn {
      width: 46px; height: 46px;
      border-radius: var(--radius-md);
      color: var(--color-text-dim);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.18s var(--ease), color 0.18s var(--ease), box-shadow 0.18s var(--ease);
    }
    .nav-btn:hover { background: rgba(168, 85, 247, 0.1); color: var(--color-accent); }
    .nav-btn.active {
      color: var(--color-accent);
      background: var(--color-accent-soft);
      box-shadow: inset 3px 0 0 var(--color-accent);
    }
    .nav-spacer { flex: 1; }

    /* ===== 内容区 ===== */
    .content { flex: 1; overflow: hidden; position: relative; }
    .page { display: none; width: 100%; height: 100%; overflow-y: auto; }
    .page.active { display: block; }

    /* ===== 首页 ===== */
    .home-layout {
      padding: 40px 36px;
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 26px;
      background:
        radial-gradient(circle at 20% 18%, rgba(168, 85, 247, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 88% 82%, rgba(168, 85, 247, 0.14) 0%, transparent 50%);
    }
    .home-hero { text-align: center; animation: fadeDown 0.6s var(--ease) both; }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .home-hero h1 {
      font-size: 36px; font-weight: 800;
      color: var(--color-text);
      margin-bottom: 10px;
      background: var(--color-accent-grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .home-hero p { font-size: 14px; color: var(--color-text-sub); line-height: 1.7; max-width: 480px; }

    .launch-btn {
      padding: 14px 36px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 15px; font-weight: 700; letter-spacing: 1px;
      color: #fff;
      background: var(--color-accent-grad);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 22px var(--color-accent-glow), inset 0 1px 0 rgba(255,255,255,0.35);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: background 0.2s, transform 0.15s var(--ease), box-shadow 0.2s;
      animation: fadeIn 0.7s 0.2s var(--ease) both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .launch-version { font-size: 11px; opacity: 0.8; font-weight: 400; letter-spacing: 0.5px; }
    .launch-btn:hover {
      background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%);
      transform: translateY(-3px);
      box-shadow: 0 14px 30px var(--color-accent-glow), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .launch-btn:active { transform: translateY(0); }

    .update-notice {
      font-size: 12px; color: var(--color-text-sub);
      text-align: center; max-width: 520px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }

    /* ===== 下载页 ===== */
    .download-layout { display: flex; height: 100%; }
    .download-tabs {
      width: 180px;
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 6px;
      border-right: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .dt-tab {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--color-text-sub);
      text-align: left;
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .dt-tab:hover { background: rgba(168, 85, 247, 0.08); color: var(--color-text); }
    .dt-tab.active {
      background: var(--color-accent-soft);
      color: var(--color-accent);
      border-color: var(--color-border-strong);
    }
    .dt-tab-title { display: block; font-size: 13px; font-weight: 600; }
    .dt-tab-sub { display: block; font-size: 11px; opacity: 0.6; margin-top: 2px; }
    .download-content { flex: 1; overflow-y: auto; padding: 22px; }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .feature-card {
      background: var(--color-surface-strong);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      backdrop-filter: blur(14px) saturate(150%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease), border-color 0.22s;
      animation: fadeUp 0.5s var(--ease) both;
    }
    .feature-card:nth-child(1) { animation-delay: 0s; }
    .feature-card:nth-child(2) { animation-delay: 0.08s; }
    .feature-card:nth-child(3) { animation-delay: 0.16s; }
    .feature-card:nth-child(4) { animation-delay: 0.24s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .feature-card:hover {
      transform: translateY(-5px);
      border-color: var(--color-border-strong);
      box-shadow: 0 12px 28px var(--color-accent-glow);
    }
    .feature-img {
      width: 100%; height: 130px;
      background: #ead6ff;
      overflow: hidden;
      border-radius: 12px;
    }
    .feature-img img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      border-radius: 12px;
    }
    .feature-img .placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #b99bd4; font-size: 12px;
    }
    .feature-desc {
      padding: 14px 16px 16px;
      font-size: 13px;
      color: var(--color-text);
      line-height: 1.6;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏 -->
  <div class="topbar">
    <div class="topbar-logo">Pulse<span>Launcher</span></div>
  </div>

  <!-- 自定义应用边框 -->
  <div class="app-frame">
    <!-- 标题栏 -->
    <header class="titlebar">
      <div class="titlebar-logo">Pulse Launcher</div>
    </header>

    <!-- 主体内容 -->
    <main class="main">
      <!-- 左侧导航 -->
      <nav class="sidebar" id="sidebar">
        <button class="nav-btn nav-btn-play active" data-page="home" title="主页">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M6 4 L20 12 L6 20 Z" fill="currentColor" />
          </svg>
        </button>
        <button class="nav-btn nav-btn-download" data-page="download" title="下载">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M12 3 L12 15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
            <path d="M7 11 L12 16 L17 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5 19 L19 19" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          </svg>
        </button>
        <div class="nav-spacer"></div>
      </nav>

      <!-- 右侧内容 -->
      <section class="content" id="content">
        <!-- 启动界面（主页） -->
        <div class="page page-home active" data-page="home">
          <div class="home-layout">
            <div class="home-hero">
              <h1>PulseLauncher</h1>
              <p>新一代 Minecraft Java 版启动器 — 极速启动，轻量纯粹，为你带来流畅的游戏体验。</p>
            </div>
            <button class="launch-btn" id="launchBtn">
              <span class="launch-label">下载最新版</span>
              <span class="launch-version" id="launchVersion">加载中...</span>
            </button>
            <div class="update-notice" id="updateNotice" style="display:none;"></div>
          </div>
        </div>

        <!-- 下载界面（展示4张特色卡片） -->
        <div class="page page-download" data-page="download">
          <div class="download-layout">
            <div class="download-tabs">
              <button class="dt-tab active" data-cat="features">
                <span class="dt-tab-title">特色功能</span>
                <span class="dt-tab-sub">软件亮点介绍</span>
              </button>
            </div>
            <div class="download-content">
              <div class="feature-grid">
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="1.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 1.png</div>
                  </div>
                  <div class="feature-desc">简洁UI，界面清爽，操作直观易上手</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="2.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 2.png</div>
                  </div>
                  <div class="feature-desc">多种登录方式，灵活选择，账号随心切换</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="3.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 3.png</div>
                  </div>
                  <div class="feature-desc">丰富资源下载，覆盖全网，一键获取所需</div>
                </div>
                <div class="feature-card">
                  <div class="feature-img">
                    <img src="4.png" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='flex';">
                    <div class="placeholder">图片 4.png</div>
                  </div>
                  <div class="feature-desc">简单资源管理，分类清晰，文件一目了然</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const navBtns = document.querySelectorAll('.nav-btn');
    const pages = document.querySelectorAll('.page');

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const page = btn.dataset.page;
        navBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        pages.forEach(p => p.classList.remove('active'));
        document.querySelector(`.page[data-page="${page}"]`).classList.add('active');
      });
    });

    // 检查更新
    async function checkUpdate() {
      let latest = null;
      try {
        const res = await fetch('update.json?t=' + Date.now());
        latest = await res.json();
      } catch (e) {
        // 读取失败时使用默认版本，不阻止下载
        latest = { version: '1.0.1', downloadUrl: '' };
      }
      const versionEl = document.getElementById('launchVersion');
      const noticeEl = document.getElementById('updateNotice');
      versionEl.textContent = 'V' + latest.version;
      document.getElementById('launchBtn').onclick = () => {
        if (latest.downloadUrl) {
          window.location.href = latest.downloadUrl;
        }
      };
      if (latest.releaseNotes) {
        noticeEl.style.display = 'block';
        noticeEl.textContent = '最新版本 V' + latest.version + ' — ' + latest.releaseNotes;
      }
    }
    checkUpdate();
  </script>
</body>
</html>
